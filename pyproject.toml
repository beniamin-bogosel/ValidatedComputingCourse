[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "validated-computing-course"
version = "1.0.0rc1"
description = "Notebook materials for an introductory validated computing course"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26", "matplotlib>=3.8", "gmpy2>=2.2", "python-flint>=0.7",
  "jupyterlab>=4", "ipykernel>=6", "jupytext>=1.16",
]

[project.optional-dependencies]
dev = ["nbclient>=0.10", "nbconvert>=7", "pytest>=8"]

[tool.setuptools]
packages = ["vc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

